# Copy this section into printer.cfg after installing emm_uart.py into:
#   ~/klipper/klippy/extras/emm_uart.py
#
# The three EMM/ZDT driver RX pins share F407 PA2 as the host TX line.
# Requires the matching MCU firmware patch in emm_usart.c.
# STM32F407 USART2 is fixed to TX=PA2 and RX=PA3.

[emm_uart]
baud: 115200
ids: 1, 2, 3
checksum: 0x6B
# The driver vendor recommends at least 10ms between serial commands.
# Each waypoint sends 3 motor frames plus 1 sync frame.
inter_packet_delay: 0.010
read_bytes: 0
timeout_us: 20000
play_direction_inverted: true
