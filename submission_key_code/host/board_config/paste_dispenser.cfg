# Remote screw-driven paste/glue/solder-paste dispenser.
# This is intentionally configured as a manual_stepper, not as an extruder,
# so Klipper does not require heater/temperature pins and KlipperScreen will
# not expose it as a normal hotend.
#
# Material/application:
# - Low-temperature lead-free solder paste, Sn42/Bi58, CD-LT528.
# - Drawing area target is up to about 120 mm x 120 mm.
# - Cold paste dispensing needs pressure build-up before drawing and pressure
#   release/retraction at stop points to reduce dripping and stringing.
#
# Mechanical calibration:
# - Motor-to-leadscrew drive: direct 1:1.
# - Stepper: 1.8 deg -> 200 full steps/revolution.
# - Driver microstepping: 16 -> 3200 microsteps/revolution.
# - Leadscrew: M4, single-start, 0.7 mm pitch -> 0.7 mm travel/revolution.
# - Resolution: 0.00021875 mm plunger travel/microstep.
#
# Syringe and line geometry:
# - Syringe: 10 cc, 15.6 mm inner diameter -> 191.134 uL/plunger mm.
# - One motor revolution dispenses about 133.794 uL before compliance losses.
# - One microstep dispenses about 0.0418 uL in the ideal geometry model.
# - 10 cc theoretical plunger stroke is about 52.32 mm.
# - Tube: 240 mm long, assumed 3.0 mm inner diameter -> about 1696 uL dead volume.
# - Needle: assumed 18G, 13 mm long -> roughly 7 uL dead volume, depending on wall type.
# - Empty tube + needle priming is therefore roughly 1.70 mL before material reaches the tip.

[manual_stepper paste_pump]
step_pin: PD2
dir_pin: PD5
enable_pin: !PD0
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 0.7
velocity: 2.0
accel: 30

[gcode_macro PASTE_STATE]
description: Internal state and tunable defaults for the paste dispenser
variable_syringe_area: 191.134497
variable_used_mm: 0.0
variable_max_stroke_mm: 50.0
variable_start_prime_ul: 8.0
variable_start_prime_rate: 20.0
variable_stop_retract_ul: 8.0
variable_stop_retract_rate: 60.0
variable_stop_dwell_ms: 80
variable_dot_dwell_ms: 120
gcode:
    PASTE_STATUS

[gcode_macro PASTE_STATUS]
description: Report paste dispenser state
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set used_ul = state.used_mm * state.syringe_area %}
    {% set left_mm = state.max_stroke_mm - state.used_mm %}
    {% set left_ul = left_mm * state.syringe_area %}
    { action_respond_info("Paste used %.3f mm (%.1f uL), remaining %.3f mm (%.1f uL), stop retract %.1f uL" % (state.used_mm, used_ul, left_mm, left_ul, state.stop_retract_ul)) }

[gcode_macro PASTE_ZERO]
description: Reset paste plunger software position after manually setting/refilling syringe
gcode:
    MANUAL_STEPPER STEPPER=paste_pump ENABLE=1
    MANUAL_STEPPER STEPPER=paste_pump SYNC=1
    MANUAL_STEPPER STEPPER=paste_pump SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=used_mm VALUE=0.0
    PASTE_STATUS

[gcode_macro PASTE_SET_USED]
description: Set current paste plunger used travel in mm for soft stroke tracking
gcode:
    {% set mm = params.MM|default(0.0)|float %}
    {% set positive_mm = mm if mm >= 0 else 0.0 %}
    SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=used_mm VALUE={positive_mm}
    PASTE_STATUS

[gcode_macro PASTE_TUNE]
description: Tune prime/retract defaults for solder paste stop control
gcode:
    {% if 'PRIME_UL' in params %}
        SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=start_prime_ul VALUE={params.PRIME_UL|float}
    {% endif %}
    {% if 'PRIME_RATE' in params %}
        SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=start_prime_rate VALUE={params.PRIME_RATE|float}
    {% endif %}
    {% if 'RETRACT_UL' in params %}
        SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=stop_retract_ul VALUE={params.RETRACT_UL|float}
    {% endif %}
    {% if 'RETRACT_RATE' in params %}
        SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=stop_retract_rate VALUE={params.RETRACT_RATE|float}
    {% endif %}
    {% if 'STOP_DWELL' in params %}
        SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=stop_dwell_ms VALUE={params.STOP_DWELL|int}
    {% endif %}
    {% if 'MAX_STROKE' in params %}
        SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=max_stroke_mm VALUE={params.MAX_STROKE|float}
    {% endif %}
    PASTE_STATUS

[gcode_macro PASTE_PUSH]
description: Push paste dispenser by screw/plunger travel in mm
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set mm = params.MM|default(0.1)|float %}
    {% set speed = params.SPEED|default(0.2)|float %}
    {% set travel = mm if mm >= 0 else 0 - mm %}
    {% set new_used = state.used_mm + travel %}
    {% if new_used > state.max_stroke_mm %}
        { action_raise_error("Paste stroke limit exceeded: requested %.3f mm, used %.3f / max %.3f mm. Refill/reset with PASTE_ZERO or raise MAX_STROKE carefully." % (travel, state.used_mm, state.max_stroke_mm)) }
    {% endif %}
    MANUAL_STEPPER STEPPER=paste_pump ENABLE=1
    MANUAL_STEPPER STEPPER=paste_pump SYNC=1
    MANUAL_STEPPER STEPPER=paste_pump SET_POSITION=0
    G4 P20
    MANUAL_STEPPER STEPPER=paste_pump MOVE={travel} SPEED={speed} ACCEL=30 SYNC=1
    SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=used_mm VALUE={new_used}

[gcode_macro PASTE_PULL]
description: Pull back paste dispenser by screw/plunger travel in mm
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set mm = params.MM|default(0.05)|float %}
    {% set speed = params.SPEED|default(0.2)|float %}
    {% set positive_mm = mm if mm >= 0 else 0 - mm %}
    {% set travel = 0 - positive_mm %}
    {% set new_used = state.used_mm - positive_mm %}
    {% if new_used < 0 %}
        {% set new_used = 0.0 %}
    {% endif %}
    MANUAL_STEPPER STEPPER=paste_pump ENABLE=1
    MANUAL_STEPPER STEPPER=paste_pump SYNC=1
    MANUAL_STEPPER STEPPER=paste_pump SET_POSITION=0
    G4 P20
    MANUAL_STEPPER STEPPER=paste_pump MOVE={travel} SPEED={speed} ACCEL=30 SYNC=1
    SET_GCODE_VARIABLE MACRO=PASTE_STATE VARIABLE=used_mm VALUE={new_used}

[gcode_macro PASTE_PUSH_UL]
description: Push paste dispenser by approximate volume in microliters
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set ul = params.UL|default(10.0)|float %}
    {% set rate = params.RATE|default(25.0)|float %}
    {% set positive_ul = ul if ul >= 0 else 0 - ul %}
    {% set positive_rate = rate if rate > 0 else 25.0 %}
    {% set mm = positive_ul / state.syringe_area %}
    {% set speed = positive_rate / state.syringe_area %}
    PASTE_PUSH MM={mm} SPEED={speed}

[gcode_macro PASTE_PULL_UL]
description: Pull back paste dispenser by approximate volume in microliters
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set ul = params.UL|default(5.0)|float %}
    {% set rate = params.RATE|default(25.0)|float %}
    {% set positive_ul = ul if ul >= 0 else 0 - ul %}
    {% set positive_rate = rate if rate > 0 else 25.0 %}
    {% set mm = positive_ul / state.syringe_area %}
    {% set speed = positive_rate / state.syringe_area %}
    PASTE_PULL MM={mm} SPEED={speed}

[gcode_macro PASTE_PRIME_LINE]
description: Prime empty tube/needle. Use UL=1700 only for an empty 3mm-ID 240mm tube plus 18G needle.
gcode:
    {% set ul = params.UL|default(100.0)|float %}
    {% set rate = params.RATE|default(40.0)|float %}
    PASTE_PUSH_UL UL={ul} RATE={rate}

[gcode_macro PASTE_START]
description: Build a small starting pressure before drawing solder paste
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set ul = params.UL|default(state.start_prime_ul)|float %}
    {% set rate = params.RATE|default(state.start_prime_rate)|float %}
    {% set dwell = params.DWELL|default(60)|int %}
    PASTE_PUSH_UL UL={ul} RATE={rate}
    G4 P{dwell}

[gcode_macro PASTE_STOP]
description: Stop dispensing and retract to release pressure/reduce dripping
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set ul = params.UL|default(state.stop_retract_ul)|float %}
    {% set rate = params.RATE|default(state.stop_retract_rate)|float %}
    {% set dwell = params.DWELL|default(state.stop_dwell_ms)|int %}
    PASTE_PULL_UL UL={ul} RATE={rate}
    G4 P{dwell}

[gcode_macro PASTE_DOT]
description: Dispense one solder-paste dot, then retract for anti-drip
gcode:
    {% set state = printer["gcode_macro PASTE_STATE"] %}
    {% set ul = params.UL|default(5.0)|float %}
    {% set rate = params.RATE|default(25.0)|float %}
    {% set dwell = params.DWELL|default(state.dot_dwell_ms)|int %}
    {% set retract = params.RETRACT|default(state.stop_retract_ul)|float %}
    {% set retract_rate = params.RETRACT_RATE|default(state.stop_retract_rate)|float %}
    PASTE_PUSH_UL UL={ul} RATE={rate}
    G4 P{dwell}
    PASTE_PULL_UL UL={retract} RATE={retract_rate}

[gcode_macro PASTE_LINE_BEGIN]
description: Alias for PASTE_START before an XY drawing stroke
gcode:
    PASTE_START {% for key, value in params.items() %}{key}={value} {% endfor %}

[gcode_macro PASTE_LINE_END]
description: Alias for PASTE_STOP after an XY drawing stroke
gcode:
    PASTE_STOP {% for key, value in params.items() %}{key}={value} {% endfor %}

[gcode_macro PASTE_DISABLE]
description: Disable paste dispenser stepper
gcode:
    MANUAL_STEPPER STEPPER=paste_pump ENABLE=0
