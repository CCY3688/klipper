# Include this file from printer.cfg after the ESP32 firmware is flashed.
# On a Klipper host, replace port with the Linux /dev/serial/by-id path.
# The COM20 value is only for Windows bench probing and flashing.

[printercart_serial]
port: /dev/serial/by-id/usb-1a86_USB_Enhanced-SERIAL_CH9102-if00-port0
baud: 115200
timeout: 0.5
connect_on_startup: false
