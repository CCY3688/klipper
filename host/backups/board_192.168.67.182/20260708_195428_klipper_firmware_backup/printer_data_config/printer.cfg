[include fluidd.cfg]
[include paste_dispenser.cfg]
[mcu]
# 填入你之前在 WSL 里获取到的 ID
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: rotary_delta
max_velocity: 1200
max_accel: 500
max_z_velocity: 50
shoulder_radius:30.36
#   三个肩部关节形成的水平圆的半径（以毫米为单位），减去效应器：65-34.64
#   必须提供此参数。
shoulder_height:230
#   肩部关节与床之间的距离 （以毫米为单位），减去效应器工具头高度。
#   必须提供此参数。
minimum_z_position: -50

# 板载 LED 测试配置
[output_pin board_led]
pin: PC0
value: 1

[stepper_a]
    step_pin: PC1
    dir_pin: PC3
    enable_pin: !PC2
    microsteps: 16
    gear_ratio: 50:20
    endstop_pin: ^PA8
    # position_endstop 和 arm_length 通常与 A 轴保持一致
    homing_speed: 50
    position_endstop: 126
    upper_arm_length: 125
    lower_arm_length: 217
    angle:0

[stepper_b]
    step_pin: PE7
    dir_pin: PE9
    enable_pin: !PB1
    microsteps: 16
    gear_ratio: 50:20
    endstop_pin: ^PB5
    angle:120

[stepper_c]
    step_pin: PD11          # 需更换为你主板对应的 C 轴脉冲引脚
    dir_pin: PD13          # 需更换为你主板对应的 C 轴方向引脚（! 表示反向）
    enable_pin: !PD9
    microsteps: 16
    gear_ratio: 50:20
    endstop_pin: ^PD7      # C 轴限位开关引脚
    angle:240

[output_pin laser]
pin: PE6
pwm: True                 # 启用 PWM 调光
cycle_time: 0.0001        # PWM 频率为 10kHz，确保激光功率平滑
value: 0.0                # 开机默认关闭
shutdown_value: 0.0       # 极其重要：主板报错或断开连接时，强制关闭激光

[servo pen_servo]
pin: PB6
maximum_servo_angle: 360
minimum_pulse_width: 0.001
maximum_pulse_width: 0.002
initial_angle: 90

[gcode_macro PEN_DOWN]
description: Laser on for writing
gcode:
    SET_PIN PIN=laser VALUE=0.3

[gcode_macro PEN_UP]
description: Laser off
gcode:
    SET_PIN PIN=laser VALUE=0
    
