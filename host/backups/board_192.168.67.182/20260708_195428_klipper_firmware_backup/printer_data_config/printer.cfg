# EMM/ZDT closed-loop stepper driver UART test on STM32F407 PA2.
# A arm ID=1, B arm ID=2, C arm ID=3.
[emm_uart]
enabled: true
baud: 115200
ids: 1, 2, 3
checksum: 0x6B
inter_packet_delay: 0.010
read_bytes: 0
timeout_us: 20000
play_direction_inverted: true
